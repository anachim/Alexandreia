name: Release

# Il rilascio lo decide un tag, non un merge: così è sempre chiaro quale commit
# è finito in mano all'utente, e un merge su main non fa partire niente.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests --nologo

      # Un solo runner per tutte e tre le piattaforme: .NET compila self-contained
      # per gli altri sistemi senza bisogno di girarci sopra.
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          for rid in win-x64 linux-x64 osx-arm64; do
            dotnet publish -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:DebugType=none \
              -p:Version="$version" \
              -o "out/$rid"
            (cd out && zip -qr "../Alexandreia-$version-$rid.zip" "$rid")
          done

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes ./*.zip
