name: Build, test e release

# Un giro solo. I test girano su ogni push a main e su ogni PR; la release parte
# solo quando si spinge un tag v*, e solo dopo che i test sono passati — il vincolo
# è `needs`, non un comando che qualcuno si è ricordato di mettere nello script.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests --nologo

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # Solo questo lavoro scrive: i test non hanno motivo di poter pubblicare.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Solo Windows: gira su un portatile con Windows 11. Il codice resta portabile
      # (Avalonia + SQLite), quindi aggiungere linux-x64 o osx-arm64 è una parola qui.
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          rid=win-x64
          dotnet publish -c Release -r "$rid" --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -p:Version="$version" \
            -o "out/$rid"
          (cd out && zip -qr "../Alexandreia-$version-$rid.zip" "$rid")

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes ./*.zip
